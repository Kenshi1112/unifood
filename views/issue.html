<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>แจ้งปัญหา</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8fafc; }
    .issue-container {
      max-width: 480px;
      margin: 60px auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 16px 0 #0001;
      padding: 2.5rem 2rem 2rem 2rem;
    }
    .issue-title {
      text-align: center;
      margin-bottom: 2rem;
      color: #d63384;
      font-weight: bold;
    }
    .form-label { font-weight: 500; }
    #issueResult { margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>
  <div class="issue-container">
    <h2 class="issue-title">แจ้งปัญหา / ข้อเสนอแนะ</h2>
    <form id="issueForm" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="message" class="form-label">รายละเอียดปัญหา <span class="text-danger">*</span></label>
        <textarea id="message" name="message" class="form-control" rows="4" required placeholder="โปรดระบุรายละเอียดปัญหาหรือข้อเสนอแนะ"></textarea>
      </div>
      <div class="mb-3">
        <label for="image" class="form-label">แนบรูปภาพ (ถ้ามี)</label>
        <input type="file" id="image" name="image" class="form-control" accept="image/*">
      </div>
      <button type="submit" class="btn btn-danger w-100">ส่งแจ้งปัญหา</button>
      <div id="issueResult" class="text-center"></div>
    </form>
  </div>
  <script src="/js/issue.js"></script>
</body>
</html>
