<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Restaurant - My Food App</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    // Set theme on initial load to prevent flash
    (function() {
      const getPreferredTheme = () => {
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme) return storedTheme;
        return 'light'; // Default to light theme
      };
      document.documentElement.setAttribute('data-bs-theme', getPreferredTheme());
    })();
  </script>
</head>
<body class="bg-body-tertiary">
  
  <nav class="navbar navbar-expand-lg bg-body-secondary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="/">SAONLY</a>
      <button class="btn btn-sm btn-outline-secondary" id="theme-toggle-btn">🌓</button>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-primary text-white py-3">
            <h4 class="mb-0 text-center">🍽️ Add New Restaurant</h4>
          </div>
          <div class="card-body p-4">
            <form id="add-restaurant-form">
              
              <div class="mb-3">
                <label for="name" class="form-label fw-bold">Restaurant Name</label>
                <input type="text" class="form-control" id="name" placeholder="e.g. Auntie Oy's Kitchen" required>
              </div>

              <div class="mb-3">
                <label for="category" class="form-label fw-bold">Category</label>
                <select class="form-select" id="category" required>
                  <option value="" selected disabled>Select a category</option>
                  <option value="Street Food">Street Food</option>
                  <option value="Cafe">Cafe</option>
                  <option value="Buffet">Buffet</option>
                  <option value="Fast Food">Fast Food</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="university" class="form-label fw-bold">University</label>
                  <select class="form-select" id="university" required>
                    <option value="" selected disabled>Select a university</option>
                    <option value="KUKPS">KU KPS</option>
                    <option value="CU">CU</option>
                    <option value="TU">TU</option>
                    <option value="KMUTT">KMUTT</option>
                    <option value="Other">Other</option>
                  </select>
                </div>

              <div class="mb-3">
                <label for="description" class="form-label fw-bold">Description</label>
                <textarea class="form-control" id="description" rows="3" placeholder="Tell us about the food..." required></textarea>
              </div>

              <div class="mb-3">
                <label for="googleMapLink" class="form-label fw-bold">Google Maps Link</label>
                <input type="url" class="form-control" id="googleMapLink" placeholder="https://maps.google.com/...">
              </div>

              <div class="mb-3">
                <label for="image" class="form-label fw-bold">Upload Image</label>
                <input type="file" class="form-control" id="image" accept="image/*">
              </div>

              <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary btn-lg">Add Restaurant</button>
                <a href="/" class="btn btn-outline-secondary">Cancel</a>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Theme Toggler
    document.getElementById('theme-toggle-btn').addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-bs-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-bs-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });

    document.getElementById('add-restaurant-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // ตรวจสอบว่า Login หรือยัง
      const token = localStorage.getItem('token');
      
      const formData = new FormData();
      formData.append('name', document.getElementById('name').value);
      formData.append('category', document.getElementById('category').value);
      formData.append('university', document.getElementById('university').value);
      formData.append('description', document.getElementById('description').value);
      formData.append('googleMapLink', document.getElementById('googleMapLink').value);
      
      const fileInput = document.getElementById('image');
      if (fileInput.files[0]) {
        formData.append('image', fileInput.files[0]);
      }

      try {
        const res = await fetch('/api/restaurant', {
          method: 'POST',
          headers: {
            'Authorization': token ? `Bearer ${token}` : '' // ส่ง Token ไปด้วยถ้ามี
          },
          body: formData
        });

        const data = await res.json();

        if (res.ok) {
          alert('Restaurant added successfully! 🎉');
          window.location.href = '/';
        } else {
          alert(data.message || 'Error adding restaurant');
        }
      } catch (err) {
        console.error(err);
        alert('Something went wrong. Please try again.');
      }
    });
  </script>
</body>
</html>
