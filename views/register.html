<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - My Food App</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script>
    // Set theme on initial load to prevent flash
    (function() {
      const getPreferredTheme = () => {
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme) return storedTheme;
        return 'light'; // Default to light theme
      };
      document.documentElement.setAttribute('data-bs-theme', getPreferredTheme());
    })();
  </script>
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-expand-lg bg-body-secondary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="/">SAONLY</a>
      <button class="btn btn-sm btn-outline-secondary" id="theme-toggle-btn">🌓</button>
    </div>
  </nav>
  <div class="container">
    <div class="row justify-content-center mt-5">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h2 class="text-center mb-4 text-primary">Register</h2>
            <div id="error-msg" class="alert alert-danger d-none text-center"></div>
            <form id="register-form">
              <div class="mb-3">
                <input type="text" class="form-control" id="name" placeholder="Name" required>
              </div>
              <div class="mb-3">
                <input type="email" class="form-control" id="email" placeholder="Email" required>
              </div>
              <div class="mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
              </div>
              <div class="mb-3">
                <label for="role" class="form-label">Register as:</label>
                <select class="form-select" id="role" required>
                  <option value="user" selected>User (for viewing and reviewing)</option>
                  <option value="storekeeper">Storekeeper (for adding a restaurant)</option>
                </select>
              </div>
              <div class="mb-3 d-flex justify-content-center">
                <div class="g-recaptcha" data-sitekey="6Le8DG0sAAAAAASM2F_KIvktzixyW2JxZjiZo0Vh"></div>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2">Register</button>
            </form>
            <div class="text-center mt-3">
              <span class="text-muted">Already have an account?</span> <a href="/login" class="text-decoration-none">Login here</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('register-form');
    const errorMsg = document.getElementById('error-msg');

    // Theme Toggler
    document.getElementById('theme-toggle-btn').addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-bs-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-bs-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      const captchaToken = grecaptcha.getResponse();

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role, captchaToken })
        });

        const data = await res.json();

        if (res.ok) {
          // สมัครสำเร็จ ให้ไปหน้า Login
          alert('Registration successful! Please login.');
          window.location.href = '/login';
        } else {
          errorMsg.classList.remove('d-none');
          errorMsg.textContent = data.message || 'Registration failed';
        }
      } catch (err) {
        errorMsg.classList.remove('d-none');
        errorMsg.textContent = 'Something went wrong. Please try again.';
      }
    });
  </script>
</body>
</html>
