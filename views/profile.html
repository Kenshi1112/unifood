<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - My Food App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    // Set theme on initial load to prevent flash
    (function() {
      const getPreferredTheme = () => {
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme) return storedTheme;
        return 'light'; // Default to light theme
      };
      document.documentElement.setAttribute('data-bs-theme', getPreferredTheme());
    })();
  </script>
</head>
<body class="bg-body-tertiary">

  <nav class="navbar navbar-expand-lg bg-body-secondary shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="/">SAONLY</a>
      <div class="d-flex align-items-center gap-2">
        <a href="/" class="btn btn-outline-secondary btn-sm">Back to Home</a>
        <button class="btn btn-sm btn-outline-secondary" id="theme-toggle-btn">🌓</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row">
      <!-- User Info Card -->
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm border-0 text-center p-4">
          <div class="mb-3">
            <img id="user-avatar" src="https://via.placeholder.com/150" class="rounded-circle img-thumbnail" alt="Profile" style="width: 150px; height: 150px; object-fit: cover;">
          </div>
          <h3 id="user-name" class="fw-bold">Loading...</h3>
          <p id="user-email" class="text-muted">...</p>
          <span id="user-role" class="badge bg-info text-dark">User</span>
          <p class="mt-3 small text-muted">Joined: <span id="user-joined">...</span></p>
          <button class="btn btn-outline-primary w-100 mt-3" data-bs-toggle="modal" data-bs-target="#editProfileModal">Edit Profile</button>
          <button onclick="logout()" class="btn btn-danger w-100 mt-2">Logout</button>
        </div>
      </div>

      <!-- Reviews List -->
      <div class="col-md-8">
        <h4 class="mb-3">My Reviews</h4>
        <div id="my-reviews-list">
          <div class="text-center py-5">Loading reviews...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div class="modal fade" id="editProfileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Profile</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="edit-profile-form">
            <div class="mb-3">
              <label for="edit-name" class="form-label">Name</label>
              <input type="text" class="form-control" id="edit-name" required>
            </div>
            <div class="mb-3">
              <label for="edit-email" class="form-label">Email</label>
              <input type="email" class="form-control" id="edit-email" required>
            </div>
            <div class="mb-3">
              <label for="edit-avatar" class="form-label">Profile Picture</label>
              <input type="file" class="form-control" id="edit-avatar" accept="image/*">
            </div>
            <button type="submit" class="btn btn-primary w-100">Save Changes</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';

    // Theme Toggler
    document.getElementById('theme-toggle-btn').addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-bs-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-bs-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '/login';
    }

    // 1. Fetch User Profile
    async function fetchProfile() {
      try {
        const res = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const json = await res.json();
        
        if (json.success) {
          const user = json.data;
          document.getElementById('user-name').textContent = user.name;
          document.getElementById('user-email').textContent = user.email;
          document.getElementById('user-role').textContent = user.role.toUpperCase();
          document.getElementById('user-joined').textContent = new Date(user.createdAt).toLocaleDateString();
          if (user.avatar) {
            document.getElementById('user-avatar').src = user.avatar;
          }
          
          // Pre-fill modal
          document.getElementById('edit-name').value = user.name;
          document.getElementById('edit-email').value = user.email;
        }
      } catch (err) {
        console.error(err);
      }
    }

    // 2. Fetch User Reviews
    async function fetchMyReviews() {
      try {
        const res = await fetch('/api/review/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const json = await res.json();
        const list = document.getElementById('my-reviews-list');
        list.innerHTML = '';

        if (json.data.length === 0) {
          list.innerHTML = '<div class="alert alert-info">You haven\'t reviewed any restaurants yet.</div>';
          return;
        }

        json.data.forEach(review => {
          const item = document.createElement('div');
          item.className = 'card mb-3 border-0 shadow-sm';
          item.innerHTML = `
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="card-title mb-0 text-primary">
                  <a href="/review/${review.restaurant._id}" class="text-decoration-none">${review.restaurant.name}</a>
                </h5>
                <span class="badge bg-warning text-dark">⭐ ${review.rating}/5</span>
              </div>
              <p class="card-text text-secondary">"${review.comment}"</p>
              <div class="d-flex justify-content-between align-items-center mt-3">
                <small class="text-muted">${new Date(review.createdAt).toLocaleDateString()}</small>
                <a href="/review/${review.restaurant._id}" class="btn btn-sm btn-outline-primary">Go to Review</a>
              </div>
            </div>
          `;
          list.appendChild(item);
        });
      } catch (err) {
        console.error(err);
      }
    }

    // 3. Update Profile
    document.getElementById('edit-profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = new FormData();
      formData.append('name', document.getElementById('edit-name').value);
      formData.append('email', document.getElementById('edit-email').value);
      
      const fileInput = document.getElementById('edit-avatar');
      if (fileInput.files[0]) {
        formData.append('avatar', fileInput.files[0]);
      }

      try {
        const res = await fetch('/api/auth/updatedetails', {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });
        const data = await res.json();
        if (res.ok) {
          alert('Profile updated!');
          window.location.reload();
        } else {
          alert(data.message || 'Error updating profile');
        }
      } catch (err) { console.error(err); }
    });

    fetchProfile();
    fetchMyReviews();
  </script>
</body>
</html>
