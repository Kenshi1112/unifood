<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniFood</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    // Set theme on initial load to prevent flash
    (function() {
      const getPreferredTheme = () => {
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme) return storedTheme;
        return 'light'; // Default to light theme
      };
      document.documentElement.setAttribute('data-bs-theme', getPreferredTheme());
    })();
  </script>
  <style>
    .card-img-top { height: 200px; object-fit: cover; }
    .card { transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
  </style>
</head>
<body class="bg-body-tertiary">

  <nav class="navbar navbar-expand-lg bg-body-secondary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="/">SAONLY</a>
      <div class="d-flex align-items-center gap-2">
        <div id="nav-links" class="d-flex gap-2">
          </div>
        <button class="btn btn-sm btn-outline-secondary" id="theme-toggle-btn">🌓</button>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h2 class="text-center mb-5 text-secondary">UniFood</h2>
    
    <div class="row justify-content-center mb-4">
      <div class="col-md-8">
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <div class="flex-grow-1">
            <div class="input-group shadow-sm">
              <input type="text" id="search-keyword" class="form-control" placeholder="Search by name...">
              <select class="form-select" id="search-category" style="max-width: 200px;">
                <option value="">All Categories</option>
                <option value="Street Food">Street Food</option>
                <option value="Cafe">Cafe</option>
                <option value="Buffet">Buffet</option>
                <option value="Fast Food">Fast Food</option>
                <option value="Other">Other</option>
              </select>
              <div class="col-md-3">
                <select id="select-university" class="form-select">
                  <option value="">All Universities</option>
                  <option value="KUKPS">KU KPS</option>
                  <option value="CU">CU</option>
                  <option value="TU">TU</option>
                  <option value="KMUTT">KMUTT</option>
                </select>
              </div>
              <button id="search-btn" class="btn btn-primary" type="button">Search</button>
            </div>
          </div>
          <div class="favorite-checkbox-container ms-auto" id="favorite-toggle-btn-container" style="display:none;">
            <button id="show-favorites-only-btn" class="btn btn-outline-danger favorite-toggle-btn" type="button" title="แสดงเฉพาะร้านที่ Favorite" aria-pressed="false">
              <span id="favorite-icon" class="bi bi-heart"></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="restaurant-list" class="row g-4">
      </div>
    
    <div id="no-data" class="text-center mt-5 d-none">
      <p class="lead text-muted">No restaurants found.</p>
    </div>
  </div>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const token = localStorage.getItem('token');
    let currentUserId = null;
    let currentUserRole = null;

    if (token) {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        currentUserId = payload.id;
        currentUserRole = payload.role;
      } catch (e) {
        console.error(e);
      }
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '/login';
    }

    window.addEventListener('DOMContentLoaded', function () {

      const navLinks = document.getElementById('nav-links');
      const favContainer = document.getElementById('favorite-toggle-btn-container');
      const restaurantList = document.getElementById('restaurant-list');
      const noData = document.getElementById('no-data');
      
      // แก้ไข: ดึงปุ่ม Search ผ่าน ID แทน class เพื่อกันการดึงผิดปุ่ม
      const searchBtn = document.getElementById('search-btn');
      const favToggleBtn = document.getElementById('show-favorites-only-btn');

      let userFavorites = [];
      let showFavoritesOnly = false;

      // =========================
      // NAVBAR
      // =========================
      if (token) {
        let addBtn = '';
        let adminBtn = '';

        if (currentUserRole === 'admin' || currentUserRole === 'storekeeper') {
          addBtn = `<a href="/add" class="btn btn-primary">+ Add Restaurant</a>`;
        }

        if (currentUserRole === 'admin') {
          adminBtn = `<a href="/admin" class="btn btn-warning">Admin Panel</a>`;
        }

        navLinks.innerHTML = `
          ${addBtn}
          ${adminBtn}
          <a href="/profile" class="btn btn-outline-primary">Profile</a>
          <a href="/issue" class="btn btn-outline-danger">แจ้งปัญหา</a>
          <button class="btn btn-outline-danger" id="logout-btn">Logout</button>
        `;

        document.getElementById('logout-btn').addEventListener('click', logout);
      } else {
        navLinks.innerHTML = `
          <a href="/login" class="btn btn-outline-primary">Login</a>
          <a href="/register" class="btn btn-primary">Register</a>
          <a href="/issue" class="btn btn-outline-danger">แจ้งปัญหา</a>
        `;
      }

      if (currentUserRole === 'user') {
        favContainer.style.display = '';
      }

      // =========================
      // FETCH FAVORITES
      // =========================
      async function fetchFavorites() {
        if (!token || currentUserRole !== 'user') return [];
        try {
          const res = await fetch('/api/auth/favorites', {
            headers: { Authorization: 'Bearer ' + token }
          });
          if (!res.ok) return [];
          const json = await res.json();
          return (json.favorites || []).map(f => f._id || f);
        } catch {
          return [];
        }
      }

      // =========================
      // FETCH RESTAURANTS
      // =========================
      async function fetchRestaurants() {
        // แก้ไข: เพิ่มการตัดช่องว่าง (.trim()) และดึงค่ามหาลัย
        const keyword = document.getElementById('search-keyword').value.trim();
        const category = document.getElementById('search-category').value;
        const university = document.getElementById('select-university').value;

        let params = new URLSearchParams();
        if (keyword) params.append('keyword', keyword);
        if (category) params.append('category', category);
        if (university) params.append('university', university); // เพิ่มการส่งค่ามหาลัย
        if (showFavoritesOnly) params.append('favorites', 'true');

        let fetchOptions = {};
        if (showFavoritesOnly && token) {
          fetchOptions.headers = {
            Authorization: 'Bearer ' + token
          };
        }

        try {
          userFavorites = await fetchFavorites();

          const res = await fetch(`/api/restaurant?${params.toString()}`, fetchOptions);

          if (!res.ok) {
            console.error('Fetch restaurants failed:', res.status);
            restaurantList.innerHTML = '';
            noData.classList.remove('d-none');
            return;
          }

          const json = await res.json();
          const data = json.data;

          restaurantList.innerHTML = '';
          
          if (!data || data.length === 0) {
            noData.classList.remove('d-none');
            return;
          }
          
          noData.classList.add('d-none');

          data.forEach(r => {
            const isOwner = currentUserId && (r.user === currentUserId);
            const isAdmin = currentUserRole === 'admin';
            const isFavorite = userFavorites.includes(r._id);

            const imageSrc = (r.images && r.images.length > 0)
              ? r.images[0]
              : (r.image || 'https://via.placeholder.com/400x200?text=No+Image');

            const col = document.createElement('div');
            col.className = 'col-md-6 col-lg-4';

            col.innerHTML = `
              <div class="card h-100 shadow-sm border-0 clickable-card" data-id="${r._id}" style="cursor:pointer">
                <img src="${imageSrc}" class="card-img-top">
                <div class="card-body">
                  <h5 class="fw-bold">${r.name}</h5>
                  <div class="text-warning fw-bold">⭐ ${r.averageRating || 0} / 5</div>
                  <p class="text-muted small">${r.description || ''}</p>
                  <div class="d-flex justify-content-between align-items-center mt-3">
                    ${r.googleMapLink ? `<a href="${r.googleMapLink}" target="_blank" class="btn btn-sm btn-outline-primary map-btn">📍 View Map</a>` : ''}
                    <a href="/review/${r._id}" class="btn btn-sm btn-outline-warning review-btn">⭐ Review</a>
                    ${isOwner || isAdmin ? `<button class="btn btn-sm btn-danger delete-btn" data-id="${r._id}">Delete</button>` : ''}
                    ${currentUserRole === 'user' ? `<button class="btn btn-sm favorite-btn" data-id="${r._id}" style="background:none;border:none"><span class="bi ${isFavorite ? 'bi-heart-fill' : 'bi-heart'}" style="font-size:1.5rem;color:#dc3545"></span></button>` : ''}
                  </div>
                </div>
              </div>
            `;

            restaurantList.appendChild(col);
          });

        } catch (err) {
          console.error('Error fetching restaurants:', err);
          restaurantList.innerHTML = '';
          noData.classList.remove('d-none');
        }
      }

      // =========================
      // EVENT DELEGATION
      // =========================
      restaurantList.addEventListener('click', async function (e) {
        // FAVORITE
        const favBtn = e.target.closest('.favorite-btn');
        if (favBtn) {
          e.stopPropagation();
          const id = favBtn.dataset.id;
          const isFav = userFavorites.includes(id);

          const method = isFav ? 'DELETE' : 'POST';

          const res = await fetch(`/api/auth/favorite/${id}`, {
            method,
            headers: { Authorization: 'Bearer ' + token }
          });

          if (res.ok) {
            userFavorites = await fetchFavorites();
            fetchRestaurants();
          }
          return;
        }

        // DELETE
        const deleteBtn = e.target.closest('.delete-btn');
        if (deleteBtn) {
          e.stopPropagation();
          const id = deleteBtn.dataset.id;

          if (!confirm('Are you sure?')) return;

          await fetch('/api/restaurant/' + id, {
            method: 'DELETE',
            headers: { Authorization: 'Bearer ' + token }
          });

          fetchRestaurants();
          return;
        }

        // CLICK CARD
        const card = e.target.closest('.clickable-card');
        if (card && !e.target.closest('a') && !e.target.closest('button')) {
          window.location.href = '/restaurant/' + card.dataset.id;
        }
      });

      // =========================
      // SEARCH BUTTON
      // =========================
      if (searchBtn) {
        searchBtn.addEventListener('click', fetchRestaurants);
      }

      // =========================
      // FAVORITE TOGGLE FILTER
      // =========================
      if (favToggleBtn) {
        favToggleBtn.addEventListener('click', function () {
          showFavoritesOnly = !showFavoritesOnly;
          this.classList.toggle('active');
          fetchRestaurants();
        });
      }

      // =========================
      // THEME
      // =========================
      document.getElementById('theme-toggle-btn').addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-bs-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-bs-theme', newTheme);
        localStorage.setItem('theme', newTheme);
      });

      fetchRestaurants();
    });
  </script>

</body>
</html>
