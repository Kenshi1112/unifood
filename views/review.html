<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Restaurant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    // Set theme on initial load to prevent flash
    (function() {
      const getPreferredTheme = () => {
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme) return storedTheme;
        return 'light'; // Default to light theme
      };
      document.documentElement.setAttribute('data-bs-theme', getPreferredTheme());
    })();
  </script>
</head>
<body class="bg-body-tertiary">

  <nav class="navbar navbar-expand-lg bg-body-secondary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="/">SAONLY</a>
      <button class="btn btn-sm btn-outline-secondary" id="theme-toggle-btn">🌓</button>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        
        <!-- Restaurant Info -->
        <div class="text-center mb-4">
          <h2 id="restaurant-name" class="fw-bold text-primary">Loading...</h2>
          <div id="chat-button-container" class="mt-2 mb-2 d-flex justify-content-center align-items-center">
            <button class="btn btn-info" data-bs-toggle="modal" data-bs-target="#shareModal" onclick="generateQRCode()">🔗 Share via QR</button>
          </div>
          <a href="/" class="btn btn-outline-secondary btn-sm mt-2">← Back to Home</a>
        </div>

        <!-- Previous Reviews -->
        <h4 class="mb-3">Recent Reviews</h4>
        <div id="reviews-list">
          <!-- Reviews will be loaded here -->
        </div>

        <!-- Review Form -->
        <div class="card shadow-sm border-0 mt-5">
          <div class="card-header bg-warning text-dark">
            <h5 class="mb-0">⭐ Write a Review</h5>
          </div>
          <div class="card-body">
            <form id="review-form">
              <div class="mb-3">
                <label class="form-label fw-bold">Rating</label>
                <select class="form-select" id="rating" required>
                  <option value="5">5 - Excellent</option>
                  <option value="4">4 - Good</option>
                  <option value="3">3 - Average</option>
                  <option value="2">2 - Poor</option>
                  <option value="1">1 - Terrible</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Comment</label>
                <textarea class="form-control" id="comment" rows="3" placeholder="Share your experience..." required></textarea>
              </div>
              <button type="submit" class="btn btn-primary w-100">Submit Review</button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Share Modal -->
  <div class="modal fade" id="shareModal" tabindex="-1" aria-labelledby="shareModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="shareModalLabel">Share Restaurant</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center">
          <p>Scan this QR code to open this page on another device.</p>
          <div id="qrcode-container" class="d-flex justify-content-center mb-3">
            <!-- QR Code will be rendered here -->
          </div>
          <p class="mt-2">Or copy the link:</p>
          <input type="text" class="form-control" id="share-link" readonly>
        </div>
      </div>
    </div>
  </div>

  <!-- Chat Modal -->
  <div class="modal fade" id="chatModal" tabindex="-1" aria-labelledby="chatModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="chatModalLabel">💬 Chat with Owner</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="chat-messages" class="mb-3 p-2" style="height: 350px; overflow-y: scroll; border: 1px solid #dee2e6; background-color: #f8f9fa; border-radius: 5px;">
            <!-- Chat messages will appear here -->
          </div>
          <form id="chat-form">
            <div class="input-group">
              <input type="text" id="chat-input" class="form-control" placeholder="Type a message..." required autocomplete="off">
              <button class="btn btn-primary" type="submit">Send</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Get Restaurant ID from URL (e.g., /review/12345)
    const restaurantId = window.location.pathname.split('/').pop();
    const token = localStorage.getItem('token');
    
    // ดึง User ID จาก Token เพื่อเช็คว่าเป็นเจ้าของรีวิวหรือไม่
    let currentUserId = null;
    let currentUserRole = null;
    if (token) {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        currentUserId = payload.id;
        currentUserRole = payload.role;
      } catch (e) { console.error(e); }
    }

    let isEditing = false;
    let editingReviewId = null;
    let restaurantOwnerId = null;
    let chatSocket = null;

    // Theme Toggler
    document.getElementById('theme-toggle-btn').addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-bs-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-bs-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });

    // 1. Fetch Restaurant Details
    async function fetchDetails() {
      try {
        const res = await fetch(`/api/restaurant/${restaurantId}`);
        const data = await res.json();
        restaurantOwnerId = data.user; // Assume API returns owner's user ID
        document.getElementById('restaurant-name').textContent = data.name;

        // Add chat button if logged in
        if (currentUserId) {
          const chatBtnContainer = document.getElementById('chat-button-container');
          let chatBtnHtml = '';
          if (currentUserId !== restaurantOwnerId) {
            chatBtnHtml = `<button class="btn btn-success me-2" data-bs-toggle="modal" data-bs-target="#chatModal" onclick="openChat()">💬 Chat with Owner</button>`;
          } else {
            chatBtnHtml = `<button class="btn btn-primary me-2" data-bs-toggle="modal" data-bs-target="#chatModal" onclick="openChat()">💬 Open Chat Room</button>`;
          }
          chatBtnContainer.insertAdjacentHTML('afterbegin', chatBtnHtml); // Prepend chat button
        }

      } catch (err) {
        console.error(err);
      }
    }

    // 2. Fetch Existing Reviews
    async function fetchReviews() {
      try {
        const res = await fetch(`/api/review/${restaurantId}`);
        const json = await res.json();
        const list = document.getElementById('reviews-list');
        list.innerHTML = '';

        if (json.data.length === 0) {
          list.innerHTML = '<p class="text-muted">No reviews yet. Be the first!</p>';
          return;
        }

        json.data.forEach(review => {
          const isOwner = currentUserId && (review.user._id === currentUserId || review.user === currentUserId);
          const isAdmin = currentUserRole === 'admin';
          
          const item = document.createElement('div');
          item.className = 'card mb-3 border-0 shadow-sm';
          item.innerHTML = `
            <div class="card-body">
              <div class="d-flex justify-content-between">
                <h6 class="card-title fw-bold">${review.user ? review.user.name : 'Unknown User'}</h6>
                <span class="text-warning fw-bold">⭐ ${review.rating}/5</span>
              </div>
              <p class="card-text text-secondary">${review.comment}</p>
              <div class="d-flex justify-content-between align-items-center">
                <small class="text-muted">${new Date(review.createdAt).toLocaleDateString()}</small>
                ${isOwner || isAdmin ? `
                  <div>
                    ${isOwner ? `<button class="btn btn-sm btn-outline-primary me-1" onclick="startEdit('${review._id}', '${review.rating}', '${review.comment.replace(/'/g, "\\'")}')">Edit</button>` : ''}
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteReview('${review._id}')">Delete</button>
                  </div>
                ` : ''}
              </div>
            </div>
          `;
          list.appendChild(item);
        });
      } catch (err) {
        console.error(err);
      }
    }

    // ฟังก์ชันเริ่มแก้ไขรีวิว
    window.startEdit = (id, rating, comment) => {
      isEditing = true;
      editingReviewId = id;
      document.getElementById('rating').value = rating;
      document.getElementById('comment').value = comment;
      
      const submitBtn = document.querySelector('button[type="submit"]');
      submitBtn.textContent = 'Update Review';
      submitBtn.classList.replace('btn-primary', 'btn-success');
      
      document.querySelector('.card-header h5').textContent = '✏️ Edit Your Review';
      window.scrollTo(0, 0);
    };

    // ฟังก์ชันลบุรีวิว
    window.deleteReview = async (id) => {
      if (!confirm('Are you sure you want to delete this review?')) return;
      try {
        const res = await fetch(`/api/review/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          alert('Review deleted');
          window.location.reload();
        } else {
          alert('Failed to delete');
        }
      } catch (e) { console.error(e); }
    };

    // 3. Submit Review
    document.getElementById('review-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!token) {
        alert('Please login to review');
        window.location.href = '/login';
        return;
      }

      const rating = document.getElementById('rating').value;
      const comment = document.getElementById('comment').value;

      try {
        let url = '/api/review';
        let method = 'POST';

        if (isEditing) {
          url = `/api/review/${editingReviewId}`;
          method = 'PUT';
        }

        const res = await fetch(url, {
          method: method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ restaurantId, rating, comment })
        });

        const data = await res.json();
        if (res.ok) {
          alert(isEditing ? 'Review updated!' : 'Review added!');
          window.location.reload();
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('Error submitting review');
      }
    });

    // 4. QR Code Generation
    window.generateQRCode = () => {
      const url = window.location.href;
      const qrContainer = document.getElementById('qrcode-container');
      const shareLinkInput = document.getElementById('share-link');

      // Set the link in the input box for easy copying
      shareLinkInput.value = url;

      // Clear previous QR code if any
      qrContainer.innerHTML = '';

      // Generate QR code using the qrcode.js library
      QRCode.toCanvas(url, { width: 256, margin: 1 }, function (err, canvas) {
        if (err) {
          console.error(err);
          qrContainer.innerHTML = '<p class="text-danger">Could not generate QR code.</p>';
          return;
        }
        qrContainer.appendChild(canvas);
      });
    };

    // 5. Chat Functions
    window.openChat = () => {
      // Update Modal Title based on role
      const modalTitle = document.getElementById('chatModalLabel');
      if (currentUserId === restaurantOwnerId) {
        modalTitle.textContent = '💬 Customer Chat Room';
      } else {
        modalTitle.textContent = '💬 Chat with Owner';
      }

      // This function is called when the modal is opened.
      // It establishes a WebSocket connection if one isn't already active.
      if (!chatSocket || chatSocket.readyState === WebSocket.CLOSED) {
        // The URL should point to your WebSocket server.
        // For production, you should use a secure connection (wss://).
        const wsUrl = `ws://${window.location.hostname}:3001`; // Example: ws://localhost:3001
        console.log(`Connecting to WebSocket server at ${wsUrl}`);
        chatSocket = new WebSocket(wsUrl);

        chatSocket.onopen = () => {
          console.log('WebSocket connection established.');
          const messagesContainer = document.getElementById('chat-messages');
          messagesContainer.innerHTML = '<p class="text-muted text-center">Connection successful!</p>';
          // Authenticate and join a chat room for this restaurant
          chatSocket.send(JSON.stringify({
            type: 'join',
            token: token, // Send token for the backend to identify the user
            restaurantId: restaurantId // Specify which chat room to join
          }));
        };

        chatSocket.onmessage = (event) => {
          const messageData = JSON.parse(event.data);
          const messagesContainer = document.getElementById('chat-messages');
          
          // ลบข้อความ "Connection successful" ทิ้งไปเลย เพื่อไม่ให้เกะกะ
          const connMsg = messagesContainer.querySelector('.text-muted');
          if (connMsg) connMsg.remove();

          // ฟังก์ชันสำหรับสร้างกล่องข้อความ
          // ฟังก์ชันสำหรับสร้างกล่องข้อความ
          const appendMessage = (text, senderId) => {
            const messageElement = document.createElement('div');
            const isMyMessage = senderId === currentUserId;

            messageElement.classList.add('d-flex', 'flex-row', 'mb-2');

            if (isMyMessage) {
              // กล่องข้อความของเรา (ฝั่งขวา): พื้นสีน้ำเงิน, ตัวหนังสือสีขาว
              messageElement.classList.add('justify-content-end');
              messageElement.innerHTML = `<div class="p-2 rounded" style="background-color: #0d6efd; color: #ffffff !important; max-width: 75%; word-break: break-word;">${text}</div>`;
            } else {
              // กล่องข้อความของอีกฝั่ง (ฝั่งซ้าย): พื้นสีเทา, ตัวหนังสือสีดำ (ใช้ #212529 เพื่อให้อ่านง่าย)
              messageElement.classList.add('justify-content-start');
              messageElement.innerHTML = `<div class="p-2 rounded" style="background-color: #e9ecef; color: #212529 !important; max-width: 75%; word-break: break-word;">${text}</div>`;
            }
            messagesContainer.appendChild(messageElement);
          };

          // แยกว่าเป็นประวัติแชท หรือ ข้อความใหม่
          if (messageData.type === 'history') {
            messageData.messages.forEach(msg => {
              appendMessage(msg.text, msg.senderId);
            });
          } else if (messageData.type === 'message') {
            appendMessage(messageData.text, messageData.senderId);
          }

          // เลื่อนจอลงไปข้อความล่าสุดเสมอ
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        };

        chatSocket.onerror = (error) => {
          console.error('WebSocket Error:', error);
          document.getElementById('chat-messages').innerHTML = '<p class="text-danger text-center">Could not connect to chat server.</p>';
        };

        chatSocket.onclose = () => {
          console.log('WebSocket connection closed.');
        };
      }
    };

    // 6. Send Chat Message
    document.getElementById('chat-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const messageText = input.value.trim();

      if (messageText && chatSocket && chatSocket.readyState === WebSocket.OPEN) {
        // The backend will use the token to identify the sender
        chatSocket.send(JSON.stringify({ type: 'message', text: messageText, token: token, restaurantId: restaurantId }));
        input.value = ''; // Clear the input field
      }
    });

    fetchDetails();
    fetchReviews();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
